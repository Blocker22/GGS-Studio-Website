<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Dashboard · GGS Studio</title>
<link rel="icon" type="image/png" href="assets/Logo_NoBG.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="admin.css">
<script>
  // Apply the saved theme before first paint so the page never flashes.
  try { const t = localStorage.getItem('ggs-admin-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}
</script>
</head>
<body>
<div id="app" aria-live="polite">
  <div class="signin"><div class="signin-card skeleton" aria-label="Loading">
    <div class="sk" style="width:64px;height:64px;border-radius:14px"></div>
    <div class="sk" style="height:22px;width:60%"></div>
    <div class="sk" style="height:40px"></div>
    <div class="sk" style="height:40px"></div>
  </div></div>
</div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<noscript><p style="padding:24px">The dashboard needs JavaScript.</p></noscript>
<script type="module" src="js/admin/app.js"></script>
</body>
</html>
