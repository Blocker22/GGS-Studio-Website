<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Bookings — GGS Studio</title>
<link rel="icon" type="image/png" href="assets/Logo_NoBG.png">
<link rel="stylesheet" href="style.css">
<style>
  .account-wrap{max-width:900px; margin:0 auto; padding:160px 24px 100px;}
  .account-head{margin-bottom:40px;}
  .account-book{
    background:var(--panel); border:1px solid var(--line); border-radius:4px;
    padding:44px; margin-bottom:70px;
  }
  .booking-card{
    background:var(--panel); border:1px solid var(--line); border-radius:4px;
    padding:24px 28px; margin-bottom:16px;
    display:flex; align-items:flex-start; justify-content:space-between; gap:20px; flex-wrap:wrap;
  }
  .booking-card h3{font-size:1.05rem; margin-bottom:6px;}
  .booking-card .meta{font-size:0.85rem; opacity:0.7; margin-bottom:4px;}
  .status-pill{
    display:inline-block; font-size:0.7rem; letter-spacing:0.06em; text-transform:uppercase;
    padding:4px 10px; border-radius:20px; border:1px solid var(--line); margin-bottom:10px;
  }
  .status-pending{color:var(--gold); border-color:var(--gold-dim);}
  .status-confirmed{color:var(--teal); border-color:var(--teal);}
  .status-cancelled{color:#e5876f; border-color:#7a4331;}
  .status-completed, .status-no_show{opacity:0.6;}
  .booking-actions{display:flex; gap:10px; flex-wrap:wrap;}
  .booking-actions button{
    font-family:var(--sans); font-size:0.78rem; padding:9px 16px; border-radius:3px; cursor:pointer;
    background:transparent; color:var(--cream); border:1px solid var(--line);
  }
  .booking-actions button:hover{border-color:var(--gold-dim);}
  .section-sub{font-size:0.75rem; letter-spacing:0.08em; text-transform:uppercase; opacity:0.55; margin:34px 0 14px;}
  .settings-card{
    background:var(--panel); border:1px solid var(--line); border-radius:4px;
    padding:36px 44px; margin-bottom:36px;
  }
  .settings-grid{display:grid; grid-template-columns:1fr 1fr; gap:0 24px;}
  .settings-row{grid-column:1/-1; border-top:1px solid var(--line); margin-top:22px; padding-top:22px;}
  .settings-row:first-child{border-top:none; margin-top:0; padding-top:0;}
  .settings-save{
    font-family:var(--sans); font-weight:600; font-size:0.8rem; letter-spacing:0.02em;
    background:transparent; color:var(--gold); border:1px solid var(--gold-dim);
    padding:10px 18px; border-radius:3px; cursor:pointer; margin-top:14px;
  }
  .settings-save:hover{background:rgba(215,174,92,0.08);}
</style>
</head>
<body>

<nav>
  <div class="logo"><img src="assets/Logo_NoBG.png" alt="GGS Studio"></div>
  <div class="nav-links" id="navLinks">
    <a href="index.html#services">Services</a>
    <a href="index.html#room">The Room</a>
    <a href="account.html">My Bookings</a>
  </div>
  <a href="account.html#book" class="nav-cta">Book Now</a>
</nav>

<div class="account-wrap">
  <div class="account-head">
    <div class="section-tag">Your account</div>
    <h2>My bookings</h2>
  </div>

  <div class="settings-card" id="settingsCard" style="display:none;">
    <div class="section-tag">Account settings</div>
    <h2 style="margin-bottom:24px;">Your details</h2>
    <div class="settings-grid">
      <div class="settings-row">
        <form id="nameForm">
          <div class="field">
            <label>Full name</label>
            <input type="text" id="setName" placeholder="Your name">
          </div>
          <button type="submit" class="settings-save">Save name</button>
          <div class="confirm-msg" id="nameMsg"></div>
        </form>
      </div>
      <div class="settings-row">
        <form id="emailForm">
          <div class="field">
            <label>Email</label>
            <input type="email" id="setEmail" placeholder="you@email.com" required>
          </div>
          <button type="submit" class="settings-save">Update email</button>
          <div class="confirm-msg" id="emailMsg"></div>
        </form>
      </div>
      <div class="settings-row">
        <form id="passwordForm">
          <div class="field-row">
            <div class="field">
              <label>New password</label>
              <div class="pw-wrap">
                <input type="password" id="setPassword" placeholder="••••••••" minlength="6" required>
                <button type="button" class="pw-toggle" data-pw-toggle="setPassword" aria-label="Show password">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
            </div>
            <div class="field">
              <label>Confirm password</label>
              <div class="pw-wrap">
                <input type="password" id="setPasswordConfirm" placeholder="••••••••" minlength="6" required>
                <button type="button" class="pw-toggle" data-pw-toggle="setPasswordConfirm" aria-label="Show password">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
            </div>
          </div>
          <button type="submit" class="settings-save">Change password</button>
          <div class="confirm-msg" id="passwordMsg"></div>
        </form>
      </div>
    </div>
  </div>

  <div class="account-book" id="book">
    <div class="section-tag">Reserve your slot</div>
    <h2 style="margin-bottom:24px;">Book a new session</h2>

    <div id="authSignedIn" class="auth-signed-in" style="display:none;">
      <span id="authWho"></span>
      <button type="button" id="logoutBtn" class="btn-ghost">Log out</button>
    </div>

    <form id="bookingForm">
      <div class="field">
        <label>Name</label>
        <input type="text" id="fName" placeholder="Your name" required>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Email</label>
          <input type="email" id="fEmail" placeholder="you@email.com" required>
        </div>
        <div class="field">
          <label>Service</label>
          <select id="fService" required>
            <option value="">Choose one</option>
            <option value="room">Room only</option>
            <option value="recording">Room + Recording</option>
            <option value="both">Room + Recording + Mixing</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>Date</label>
        <input type="date" id="fDate" required>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Start time</label>
          <input type="time" id="fStart" step="1800" required>
        </div>
        <div class="field">
          <label>End time</label>
          <input type="time" id="fEnd" step="1800" required>
        </div>
      </div>
      <div class="booking-summary" id="bookingSummary">
        <div><span>Duration</span><strong id="sumDuration">—</strong></div>
        <div><span>Total price</span><strong id="sumPrice">—</strong></div>
      </div>

      <div id="authStep" class="auth-step" style="display:none;">
        <p class="auth-step-note" id="authStepNote">One more step — create an account (or log in) to confirm this booking.</p>
        <div class="field">
          <label>Password</label>
          <div class="pw-wrap">
            <input type="password" id="authPassword" placeholder="••••••••" minlength="6">
            <button type="button" class="pw-toggle" data-pw-toggle="authPassword" aria-label="Show password">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <div class="confirm-msg" id="authMsg"></div>
      </div>

      <div class="submit-row">
        <button type="submit" id="bookSubmitBtn" class="book-submit">Confirm booking request</button>
      </div>
      <div id="authToggleRow" class="auth-toggle-row" style="display:none;">
        <button type="button" id="authToggleBtn" class="btn-ghost">Already have an account? Log in instead</button>
      </div>
      <div class="confirm-msg" id="confirmMsg"></div>
    </form>
  </div>

  <div id="signedOutMsg" style="display:none;">
    <p class="muted">Sign in above to view your bookings.</p>
  </div>

  <div id="bookingsRoot" style="display:none;">
    <div class="section-sub">Upcoming</div>
    <div id="upcomingList"><p class="muted">Loading…</p></div>
    <div class="section-sub">Past</div>
    <div id="pastList"></div>
  </div>
</div>

<script type="module">
  import { getSupabase, SUPABASE_URL, SUPABASE_ANON_KEY } from './supabase-client.js';
  import { initBooking } from './booking.js';

  const FUNCTIONS_URL = `${SUPABASE_URL}/functions/v1`;

  function formatPeso(amount){ return '₱' + Math.round(amount).toLocaleString('en-PH'); }
  function fmtRange(start, end){
    const s = new Date(start), e = new Date(end);
    const dateStr = s.toLocaleDateString('en-PH', { month:'short', day:'numeric', year:'numeric' });
    const timeStr = `${s.toLocaleTimeString('en-PH',{hour:'numeric',minute:'2-digit'})} – ${e.toLocaleTimeString('en-PH',{hour:'numeric',minute:'2-digit'})}`;
    return `${dateStr} · ${timeStr}`;
  }

  async function callFunction(name, session, body){
    const res = await fetch(`${FUNCTIONS_URL}/${name}`, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', apikey: SUPABASE_ANON_KEY, Authorization:`Bearer ${session.access_token}` },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Something went wrong.');
    return data;
  }

  function renderBooking(b, session, supabase, onChange){
    const card = document.createElement('div');
    card.className = 'booking-card';
    const room = b.rooms?.name || 'Room';
    const services = (b.booking_services || []).map(bs => bs.services?.name).filter(Boolean).join(', ');
    const canModify = ['pending','confirmed'].includes(b.status) && new Date(b.start_at) > new Date();

    card.innerHTML = `
      <div>
        <span class="status-pill status-${b.status}">${b.status.replace('_',' ')}</span>
        <h3>${room}</h3>
        <div class="meta">${fmtRange(b.start_at, b.end_at)}</div>
        ${services ? `<div class="meta">Add-ons: ${services}</div>` : ''}
        <div class="meta">Total: ${formatPeso(b.total_price)}</div>
      </div>
      <div class="booking-actions">
        ${canModify ? `<button data-action="cancel">Cancel</button>` : ''}
      </div>
    `;

    const cancelBtn = card.querySelector('[data-action="cancel"]');
    if (cancelBtn){
      cancelBtn.addEventListener('click', async () => {
        if (!confirm('Cancel this booking?')) return;
        cancelBtn.disabled = true;
        try{
          await callFunction('cancel-booking', session, { booking_id: b.id, reason: 'Cancelled by customer' });
          onChange();
        }catch(err){
          alert(err.message);
          cancelBtn.disabled = false;
        }
      });
    }
    return card;
  }

  async function loadBookings(supabase, session){
    const upcomingList = document.getElementById('upcomingList');
    const pastList = document.getElementById('pastList');
    upcomingList.innerHTML = '';
    pastList.innerHTML = '';

    const { data: bookings, error } = await supabase
      .from('bookings')
      .select('*, rooms(name), booking_services(services(name))')
      .order('start_at', { ascending: false });

    if (error){
      upcomingList.innerHTML = `<p class="muted">Could not load bookings: ${error.message}</p>`;
      return;
    }

    const now = new Date();
    const upcoming = (bookings || []).filter(b => new Date(b.start_at) >= now && b.status !== 'cancelled').reverse();
    const past = (bookings || []).filter(b => new Date(b.start_at) < now || b.status === 'cancelled');

    if (upcoming.length === 0) upcomingList.innerHTML = '<p class="muted">No upcoming bookings.</p>';
    else upcoming.forEach(b => upcomingList.appendChild(renderBooking(b, session, supabase, () => loadBookings(supabase, session))));

    if (past.length === 0) pastList.innerHTML = '<p class="muted">No past bookings yet.</p>';
    else past.forEach(b => pastList.appendChild(renderBooking(b, session, supabase, () => loadBookings(supabase, session))));
  }

  async function refreshBookingsPanel(supabase){
    const { data } = await supabase.auth.getSession();
    if (!data.session){
      document.getElementById('signedOutMsg').style.display = 'block';
      document.getElementById('bookingsRoot').style.display = 'none';
      document.getElementById('settingsCard').style.display = 'none';
      return;
    }
    document.getElementById('signedOutMsg').style.display = 'none';
    document.getElementById('bookingsRoot').style.display = 'block';
    await loadBookings(supabase, data.session);
    await refreshSettingsPanel(supabase, data.session);
  }

  function showMsg(el, text, isError){
    el.textContent = text;
    el.classList.toggle('error', !!isError);
    el.style.display = 'block';
  }

  async function refreshSettingsPanel(supabase, session){
    document.getElementById('settingsCard').style.display = 'block';
    document.getElementById('setEmail').value = session.user.email || '';
    const { data: profile } = await supabase.from('profiles').select('full_name').eq('id', session.user.id).single();
    document.getElementById('setName').value = profile?.full_name || '';
  }

  function initSettingsForms(supabase){
    document.getElementById('nameForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('nameMsg');
      msg.style.display = 'none';
      const { data } = await supabase.auth.getSession();
      if (!data.session) return;
      const fullName = document.getElementById('setName').value.trim();
      const { error } = await supabase.from('profiles').update({ full_name: fullName }).eq('id', data.session.user.id);
      if (error) showMsg(msg, error.message, true);
      else showMsg(msg, '✓ Name updated.', false);
    });

    document.getElementById('emailForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('emailMsg');
      msg.style.display = 'none';
      const email = document.getElementById('setEmail').value.trim();
      const { error } = await supabase.auth.updateUser({ email });
      if (error) showMsg(msg, error.message, true);
      else showMsg(msg, '✓ Check your new inbox to confirm the email change.', false);
    });

    document.getElementById('passwordForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('passwordMsg');
      msg.style.display = 'none';
      const pw = document.getElementById('setPassword').value;
      const confirm = document.getElementById('setPasswordConfirm').value;
      if (pw !== confirm){
        showMsg(msg, "Passwords don't match.", true);
        return;
      }
      const { error } = await supabase.auth.updateUser({ password: pw });
      if (error) showMsg(msg, error.message, true);
      else {
        showMsg(msg, '✓ Password changed.', false);
        e.target.reset();
      }
    });
  }

  (async function init(){
    const supabase = await getSupabase();
    await initBooking();
    initSettingsForms(supabase);
    await refreshBookingsPanel(supabase);
    supabase.auth.onAuthStateChange(() => refreshBookingsPanel(supabase));
    window.addEventListener('ggs:booking-created', () => refreshBookingsPanel(supabase));
  })();
</script>

</body>
</html>
