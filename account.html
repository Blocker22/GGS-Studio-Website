<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My bookings · GGS Studio</title>
<meta name="description" content="View, reschedule, or cancel your GGS Studio recording sessions.">
<link rel="canonical" href="https://www.ggsstudio.site/account">
<meta property="og:type" content="website">
<meta property="og:site_name" content="GGS Studio">
<meta property="og:title" content="My Bookings · GGS Studio">
<meta property="og:description" content="View, reschedule, or cancel your GGS Studio recording sessions.">
<meta property="og:url" content="https://www.ggsstudio.site/account">
<meta property="og:image" content="https://www.ggsstudio.site/assets/Logo_NoBG.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="My Bookings · GGS Studio">
<meta name="twitter:description" content="View, reschedule, or cancel your GGS Studio recording sessions.">
<meta name="twitter:image" content="https://www.ggsstudio.site/assets/Logo_NoBG.png">
<link rel="icon" type="image/png" href="assets/logo-nav.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap">
<link rel="stylesheet" href="style.css">
<style>
  .account-book{margin-bottom:40px; scroll-margin-top:96px;}
  .booking-card{
    border-bottom:1px solid var(--line); padding:20px 4px;
    display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; transition:border-color 0.2s, background 0.2s;
  }
  .booking-card:hover{background:var(--panel);}
  .booking-card.status-cancelled{opacity:0.7;}
  .booking-card h3{font-size:1.1rem; margin-bottom:4px;}
  .booking-card .meta{font-size:0.95rem; color:var(--text-2); margin-bottom:3px;}
  .status-pill{display:inline-flex; font-size:0.84rem; font-weight:500; padding:3px 10px; border-radius:var(--r); margin-bottom:8px; border:1px solid var(--line-strong); color:var(--text-2);}
  .status-pill.status-pending{background:var(--gold-soft); color:var(--gold); border-color:transparent;}
  .status-pill.status-confirmed{background:var(--teal-soft); color:var(--teal); border-color:transparent;}
  .status-pill.status-cancelled{background:var(--danger-soft); color:var(--danger); border-color:transparent;}
  .booking-actions{display:flex; gap:8px; flex-wrap:wrap; align-items:flex-start;}
  .booking-actions .btn-primary{padding:10px 16px; font-size:0.92rem;}
  .pay-state{max-width:52ch;}
  .pay-state-pending, .pay-state-rejected{color:var(--gold) !important;}
  .pay-state-submitted, .pay-state-succeeded{color:var(--teal) !important;}
  .card-error{color:var(--danger) !important;}
  .section-sub{font-size:1.15rem; font-weight:600; margin:32px 0 12px;}
  .reschedule-panel{flex-basis:100%; width:100%; margin-top:14px; padding-top:14px; border-top:1px dashed var(--line);}
  .reschedule-panel[hidden]{display:none;}
  .reschedule-actions{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-top:4px;}
  .reschedule-locked{color:var(--gold) !important;}
</style>
</head>
<body>

<a class="skip-link" href="#upcomingList">Skip to your bookings</a>
<nav></nav>

<div class="page-wrap">
  <div class="page-head">
    <div>
      <h2>My bookings</h2>
    </div>
    <a href="profile" class="btn-outline">Edit profile</a>
  </div>

  <div class="confirm-msg" id="payReturnMsg"></div>

  <div class="account-book" id="book">
    <h2 style="font-size:1.6rem;margin-bottom:18px">Book a new session</h2>
    <div class="book-grid">
      <div class="book-form" id="bookingFormMount"></div>
      <div class="book-side">
        <h3 style="font-size:1.2rem;margin-bottom:6px">Live availability</h3>
        <p class="section-note book-side-note">Tap a day to see the free windows.</p>
        <div class="cal" id="bookCalendar"><p class="muted">Loading the calendar…</p></div>
      </div>
    </div>
  </div>

  <div id="signedOutMsg" class="empty-state" style="display:none;">
    <p>Sign in to see the sessions you've booked.</p>
    <a href="login?next=account" class="btn-primary">Sign in</a>
  </div>

  <div id="bookingsRoot" style="display:none;">
    <div class="section-sub">Upcoming</div>
    <div id="upcomingList"><p class="muted">Loading…</p></div>
    <div class="section-sub">Past</div>
    <div id="pastList"></div>
  </div>
</div>

<script type="module">
  import { getSupabase, SUPABASE_URL, SUPABASE_ANON_KEY } from './js/supabase-client.js';
  import { deviceCredentials, fetchGuestBookings } from './js/device.js';
  import { initBooking, renderBookingForm } from './js/booking.js';
  import { initDateTimePickers } from './js/datetime-picker.js';
  import { initFooter } from './js/site.js';
  import { initAuthNav } from './js/auth.js';
  import { initBookingCalendar } from './js/availability.js';
  import { openPaymentModal } from './js/payment-qr.js';
  import { initChatbot } from './js/chatbot.js';
  import { showFieldErrors, clearFieldError } from './js/form-validate.js';

  // The form has to exist before the calendar and pickers bind to its fields.
  renderBookingForm();
  initDateTimePickers();
  initBookingCalendar();
  initChatbot();

  const FUNCTIONS_URL = `${SUPABASE_URL}/functions/v1`;

  function formatPeso(amount){ return '₱' + Math.round(amount).toLocaleString('en-PH'); }

  // renderBooking() below builds each card as an innerHTML template for speed
  // and readability, so any free-text value that lands inside it — a staff
  // member's typed reason for rejecting a receipt, an error message — has to
  // be escaped by hand rather than relying on the DOM to keep it as plain text.
  const ESCAPE_MAP = { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' };
  function escapeHtml(s){ return String(s ?? '').replace(/[&<>"']/g, (c) => ESCAPE_MAP[c]); }
  function fmtRange(start, end){
    const s = new Date(start), e = new Date(end);
    const dateStr = s.toLocaleDateString('en-PH', { month:'short', day:'numeric', year:'numeric' });
    const timeStr = `${s.toLocaleTimeString('en-PH',{hour:'numeric',minute:'2-digit'})} to ${e.toLocaleTimeString('en-PH',{hour:'numeric',minute:'2-digit'})}`;
    return `${dateStr}, ${timeStr}`;
  }

  // `session` is null for bookings made on this browser without an account —
  // the device credentials in the body stand in for the bearer token then, and
  // the Edge Function works out which of the two it was handed.
  async function callFunction(name, session, body){
    const res = await fetch(`${FUNCTIONS_URL}/${name}`, {
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        apikey: SUPABASE_ANON_KEY,
        Authorization:`Bearer ${session?.access_token || SUPABASE_ANON_KEY}`,
      },
      body: JSON.stringify({ ...deviceCredentials(), ...body }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Something went wrong.');
    return data;
  }

  // window.confirm() throws in some hosts this page can be viewed in (e.g. an
  // editor's embedded webview), so this rebuilds the same yes/no question out
  // of the modal-backdrop/.modal styling already used for the payment QR modal.
  function confirmDialog(message){
    return new Promise((resolve) => {
      const backdrop = document.createElement('div');
      backdrop.className = 'modal-backdrop';
      backdrop.innerHTML = `
        <div class="modal" role="dialog" aria-modal="true" style="width:min(420px, 100%);">
          <button type="button" class="modal-close" aria-label="Close">&times;</button>
          <h3>Confirm</h3>
          <div class="modal-body">
            <p style="font-size:0.88rem; line-height:1.55; white-space:pre-wrap; margin:0;">${message}</p>
          </div>
          <div class="modal-foot" style="display:flex; gap:10px; justify-content:flex-end;">
            <button type="button" class="btn-ghost" data-confirm-no>Cancel</button>
            <button type="button" class="btn-primary" style="width:auto;" data-confirm-yes>OK</button>
          </div>
        </div>`;
      const finish = (value) => {
        backdrop.classList.remove('open');
        setTimeout(() => backdrop.remove(), 200);
        document.removeEventListener('keydown', onKey);
        resolve(value);
      };
      const onKey = (e) => { if (e.key === 'Escape') finish(false); };
      backdrop.addEventListener('click', (e) => { if (e.target === backdrop) finish(false); });
      backdrop.querySelector('.modal-close').addEventListener('click', () => finish(false));
      backdrop.querySelector('[data-confirm-no]').addEventListener('click', () => finish(false));
      backdrop.querySelector('[data-confirm-yes]').addEventListener('click', () => finish(true));
      document.addEventListener('keydown', onKey);
      document.body.appendChild(backdrop);
      requestAnimationFrame(() => backdrop.classList.add('open'));
    });
  }

  function renderBooking(b, session, supabase, onChange, cutoffHours){
    const card = document.createElement('div');
    card.className = `booking-card status-${b.status}`;
    const room = b.rooms?.name || 'Room';
    const services = (b.booking_services || [])
      .filter(bs => bs.services?.name)
      .map(bs => bs.services.price_type === 'unit'
        ? `${bs.services.name} (${bs.quantity} ${bs.services.unit_label || 'unit'})`
        : bs.services.name)
      .join(', ');
    const startsAt = new Date(b.start_at);
    const isOpen = ['pending','confirmed'].includes(b.status);
    // Same rule the server enforces, and the same rule for both actions:
    // cancelling this close to the session costs the studio exactly what a
    // last-minute reschedule does, so one cutoff governs both. Inside the
    // window it's phone-us-only.
    const hoursAway = (startsAt.getTime() - Date.now()) / 3600000;
    const canChange = isOpen && hoursAway >= cutoffHours;
    const stillUpcoming = isOpen && startsAt > new Date();
    const durationMs = new Date(b.end_at).getTime() - startsAt.getTime();

    // A manual QR transfer moves pending → submitted → succeeded/rejected, and
    // the customer can send (or replace) a receipt at any point before it's
    // verified. There's at most one of these per booking.
    const manualPay = (b.payments || []).find(p => p.method === 'manual');
    const payState = manualPay && b.status !== 'cancelled' ? {
      pending:   { line:`Unpaid. Send ${formatPeso(manualPay.amount)} to one of our accounts and upload the receipt.`, btn:'Pay now' },
      submitted: { line:`Receipt for ${formatPeso(manualPay.amount)} received. We're checking it.`, btn:'Replace receipt' },
      rejected:  { line:`Receipt turned down: ${escapeHtml(manualPay.rejection_reason) || 'it could not be verified.'} Please send a corrected one.`, btn:'Send new receipt' },
      succeeded: { line:`${manualPay.type === 'deposit' ? 'Downpayment' : 'Payment'} of ${formatPeso(manualPay.amount)} verified.`, btn:null },
    }[manualPay.status] : null;

    card.innerHTML = `
      <div>
        <span class="status-pill status-${b.status}">${({pending:'Pending',confirmed:'Confirmed',completed:'Completed',cancelled:'Cancelled',no_show:'No-show'})[b.status] || b.status}</span>
        <h3>${room}</h3>
        <div class="meta">${fmtRange(b.start_at, b.end_at)}</div>
        ${services ? `<div class="meta">Add-ons: ${services}</div>` : ''}
        <div class="meta">Total: ${formatPeso(b.total_price)}</div>
        ${payState ? `<div class="meta pay-state pay-state-${manualPay.status}">${payState.line}</div>` : ''}
        ${stillUpcoming && !canChange
          ? `<div class="meta reschedule-locked">It's within ${cutoffHours} hours of the session, so online changes are closed. Please call the studio.</div>`
          : ''}
      </div>
      <div class="booking-actions">
        ${payState?.btn ? `<button class="btn-primary" data-action="pay">${payState.btn}</button>` : ''}
        ${canChange ? `<button class="btn-outline" data-action="reschedule">Reschedule</button>` : ''}
        ${canChange ? `<button class="btn-outline" data-action="cancel">Cancel</button>` : ''}
      </div>
      ${canChange ? `
      <form class="reschedule-panel" data-panel hidden>
        <div class="field-row">
          <div class="field">
            <label>New date</label>
            <input type="date" data-rs-date required>
          </div>
          <div class="field">
            <label>New start time</label>
            <input type="time" step="1800" data-rs-start required>
          </div>
        </div>
        <p class="field-hint">The session keeps its ${(durationMs / 3600000).toFixed(1).replace(/\.0$/, '')}-hour length and price.</p>
        <div class="reschedule-actions">
          <button type="submit" class="btn-outline" data-rs-save>Save new time</button>
          <button type="button" class="btn-ghost" data-rs-cancel>Never mind</button>
        </div>
      </form>` : ''}
    `;

    const payBtn = card.querySelector('[data-action="pay"]');
    if (payBtn){
      payBtn.addEventListener('click', () => {
        openPaymentModal({
          supabase,
          session,
          booking: b,
          amountDue: manualPay.amount,
          paymentOption: manualPay.type,
          depositPercent: b.total_price ? Math.round((Number(manualPay.amount) / Number(b.total_price)) * 100) : null,
          retryReason: manualPay.status === 'rejected' ? manualPay.rejection_reason : null,
          onSubmitted: onChange,
        });
      });
    }

    const cancelBtn = card.querySelector('[data-action="cancel"]');
    if (cancelBtn){
      cancelBtn.addEventListener('click', async () => {
        if (!(await confirmDialog('Cancel this booking? You can cancel online up to ' + cutoffHours + ' hours before the session.'))) return;
        cancelBtn.disabled = true;
        try{
          await callFunction('cancel-booking', session, { booking_id: b.id, reason: 'Cancelled by customer' });
          onChange();
        }catch(err){
          const note = document.createElement('div');
          note.className = 'meta card-error';
          note.textContent = err.message;
          card.firstElementChild.appendChild(note);
          cancelBtn.disabled = false;
        }
      });
    }

    const panel = card.querySelector('[data-panel]');
    if (panel){
      const dateEl = panel.querySelector('[data-rs-date]');
      const timeEl = panel.querySelector('[data-rs-start]');
      const saveBtn = panel.querySelector('[data-rs-save]');

      // Nothing earlier than the cutoff is selectable in the first place.
      const earliest = new Date(Date.now() + cutoffHours * 3600000);
      dateEl.min = earliest.toLocaleDateString('en-CA');
      dateEl.value = startsAt.toLocaleDateString('en-CA');
      timeEl.value = startsAt.toTimeString().slice(0, 5);

      card.querySelector('[data-action="reschedule"]').addEventListener('click', () => {
        panel.hidden = !panel.hidden;
      });
      panel.querySelector('[data-rs-cancel]').addEventListener('click', () => {
        panel.hidden = true;
        clearFieldError(dateEl);
        clearFieldError(timeEl);
      });

      panel.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearFieldError(dateEl);
        clearFieldError(timeEl);

        // Each problem is painted onto the field it belongs to and scrolled
        // into view, the same way the booking form does it, rather than one
        // generic line easy to miss below a form that's already open.
        const errors = [];
        if (!dateEl.value) errors.push([dateEl, 'Please pick a date.']);
        if (!timeEl.value) errors.push([timeEl, 'Please pick a start time.']);
        if (errors.length) { showFieldErrors(errors); return; }

        const newStart = new Date(`${dateEl.value}T${timeEl.value}:00+08:00`);
        if (isNaN(newStart.getTime())) {
          showFieldErrors([[timeEl, 'That date and time combination is not valid.']]);
          return;
        }
        if (newStart.getTime() - Date.now() < cutoffHours * 3600000) {
          showFieldErrors([[timeEl, `New time must be at least ${cutoffHours} hours from now.`]]);
          return;
        }
        const newEnd = new Date(newStart.getTime() + durationMs);

        saveBtn.disabled = true;
        try{
          await callFunction('update-booking', session, {
            booking_id: b.id,
            start_at: newStart.toISOString(),
            end_at: newEnd.toISOString(),
          });
          onChange();
        }catch(err){
          // Server-side rejections here are always about the date/time picked
          // (cutoff, conflict, closed slot) — attach the reason there too
          // instead of a message the field it's about could scroll out of view.
          showFieldErrors([[timeEl, err.message]]);
          saveBtn.disabled = false;
        }
      });
    }
    return card;
  }

  async function loadBookings(supabase, session){
    const upcomingList = document.getElementById('upcomingList');
    const pastList = document.getElementById('pastList');
    upcomingList.innerHTML = '';
    pastList.innerHTML = '';

    let bookings = [];
    let cutoffHours = 24;

    if (!session){
      // Signed out: the only bookings we can show are the ones this browser
      // made without an account. RLS gives an anonymous visitor nothing, so
      // these come back through the guest-bookings Edge Function instead.
      try {
        const guest = await fetchGuestBookings();
        bookings = guest.bookings;
        cutoffHours = guest.cutoffHours;
      } catch (err) {
        upcomingList.innerHTML = `<p class="muted">Could not load bookings: ${escapeHtml(err.message)}</p>`;
        return;
      }
    } else {
      // Staff can read every booking under RLS, so this page has to scope itself
      // to the signed-in customer — otherwise an admin's "My bookings" lists the
      // whole studio's calendar as if it were their own.
      const [{ data: rows, error }, { data: cutoffRows }] = await Promise.all([
        supabase
          .from('bookings')
          .select('*, rooms(name), booking_services(quantity, services(name, price_type, unit_label)), payments(id, method, type, status, amount, rejection_reason)')
          .eq('customer_id', session.user.id)
          .order('start_at', { ascending: false }),
        supabase.from('app_settings').select('value').eq('key', 'reschedule_cutoff_hours'),
      ]);
      if (error){
        upcomingList.innerHTML = `<p class="muted">Could not load bookings: ${escapeHtml(error.message)}</p>`;
        return;
      }
      bookings = rows || [];
      // Mirror the studio's configured cutoff rather than hardcoding 24h here.
      const parsedCutoff = Number(cutoffRows?.[0]?.value);
      cutoffHours = Number.isFinite(parsedCutoff) && parsedCutoff >= 0 ? parsedCutoff : 24;
    }

    const now = new Date();
    const upcoming = bookings.filter(b => new Date(b.start_at) >= now && b.status !== 'cancelled').reverse();
    const past = bookings.filter(b => new Date(b.start_at) < now || b.status === 'cancelled');

    // --i drives the CSS stagger so a list of cards fans in one after another.
    const append = (list) => (b, i) => {
      const card = renderBooking(b, session, supabase, () => loadBookings(supabase, session), cutoffHours);
      card.style.setProperty('--i', i);
      list.appendChild(card);
    };

    if (upcoming.length === 0) upcomingList.innerHTML = '<p class="muted">No upcoming bookings. Book a session above.</p>';
    else upcoming.forEach(append(upcomingList));

    if (past.length === 0) pastList.innerHTML = '<p class="muted">No past bookings yet.</p>';
    else past.forEach(append(pastList));
  }

  async function refreshBookingsPanel(supabase){
    const { data } = await supabase.auth.getSession();
    const session = data.session;
    const signedOutMsg = document.getElementById('signedOutMsg');
    const bookingsRoot = document.getElementById('bookingsRoot');

    if (session){
      signedOutMsg.style.display = 'none';
      bookingsRoot.style.display = 'block';
      await loadBookings(supabase, session);
      return;
    }

    // Signed out, but this browser may still have booked as a guest. Show those
    // rather than a bare "sign in" wall — and keep the sign-in prompt alongside,
    // because a browser is a fragile place to keep the only record of a session.
    const { bookings } = await fetchGuestBookings();
    if (bookings.length === 0){
      signedOutMsg.innerHTML =
        '<p>Sign in to see the sessions you\'ve booked, or just book above. No account needed.</p>' +
        '<a href="login?next=account" class="btn-primary">Sign in</a>';
      signedOutMsg.style.display = 'block';
      bookingsRoot.style.display = 'none';
      return;
    }

    signedOutMsg.innerHTML =
      '<p>These are the sessions booked on this browser. They live in this browser only: ' +
      'sign in (or make an account with the same email) and they follow you to every device.</p>' +
      '<a href="login?next=account" class="btn-primary">Sign in</a>';
    signedOutMsg.style.display = 'block';
    bookingsRoot.style.display = 'block';
    await loadBookings(supabase, null);
  }

  // Coming back from PayMongo's hosted checkout. The webhook is what actually
  // confirms the booking, so this only reports what the redirect implies.
  function showPayReturn(){
    const params = new URLSearchParams(location.search);
    const msg = document.getElementById('payReturnMsg');
    if (params.get('paid') === '1'){
      msg.textContent = 'Payment received. Your booking is confirmed once PayMongo finishes settling, usually within a minute. Refresh if it still shows as pending.';
      msg.classList.remove('error');
      msg.style.display = 'block';
    } else if (params.get('cancelled') === '1'){
      msg.textContent = 'Payment was cancelled. Your slot is still held as pending: pay from this page or at the studio.';
      msg.classList.add('error');
      msg.style.display = 'block';
    } else {
      return;
    }
    // Drop the flag so a refresh doesn't keep re-announcing it.
    history.replaceState({}, '', location.pathname);
  }

  (async function init(){
    showPayReturn();
    const supabase = await getSupabase();
    initAuthNav();
    initFooter();
    await initBooking();
    await refreshBookingsPanel(supabase);
    supabase.auth.onAuthStateChange(() => refreshBookingsPanel(supabase));
    window.addEventListener('ggs:booking-created', () => refreshBookingsPanel(supabase));
    // Claiming runs just after a sign-in, so the list rendered on SIGNED_IN is
    // drawn before the guest bookings have moved across — redraw once they have.
    window.addEventListener('ggs:bookings-claimed', () => refreshBookingsPanel(supabase));
  })();
</script>

</body>
</html>
