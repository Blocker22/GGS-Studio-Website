# Builds the admin dashboard (Vite/React) and deploys the whole site
# (public site + built admin app) to GitHub Pages as static content.
# Nothing server-side is required to run this site — the backend is
# entirely Supabase (Postgres + RLS + Edge Functions); server.js exists
# only as a local dev convenience and is not part of this deployment.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin-app/package-lock.json

      - name: Install admin app dependencies
        working-directory: admin-app
        run: npm ci

      - name: Build admin app
        working-directory: admin-app
        run: npm run build

      - name: Assemble site
        run: |
          mkdir -p _site
          # Public site: everything at the repo root except dev/build tooling.
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='admin-app' \
            --exclude='_site' \
            --exclude='data' \
            --exclude='server.js' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='.env.example' \
            --exclude='.mcp.json' \
            --exclude='.gitignore' \
            ./ _site/
          # Admin dashboard, built above, served under /admin/.
          mkdir -p _site/admin
          cp -r admin-app/dist/. _site/admin/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
