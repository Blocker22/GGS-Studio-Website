<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — GGS Studio</title>
<meta name="description" content="Sign in or create an account to book a session at GGS Studio.">
<link rel="canonical" href="https://woogi999.github.io/GGS-Studio-Website/login">
<meta property="og:type" content="website">
<meta property="og:site_name" content="GGS Studio">
<meta property="og:title" content="Sign in — GGS Studio">
<meta property="og:description" content="Sign in or create an account to book a session at GGS Studio.">
<meta property="og:url" content="https://woogi999.github.io/GGS-Studio-Website/login">
<meta property="og:image" content="https://woogi999.github.io/GGS-Studio-Website/assets/Logo_NoBG.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Sign in — GGS Studio">
<meta name="twitter:description" content="Sign in or create an account to book a session at GGS Studio.">
<meta name="twitter:image" content="https://woogi999.github.io/GGS-Studio-Website/assets/Logo_NoBG.png">
<link rel="icon" type="image/png" href="assets/Logo_NoBG.png">
<link rel="stylesheet" href="style.css">
<style>
  .auth-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:120px 24px 60px;}
  .auth-card{width:100%; max-width:400px;}
  .auth-card h2{font-size:1.6rem; margin-bottom:8px;}
  .auth-card .section-note{max-width:100%; margin-bottom:28px;}
  .auth-card .logo{justify-content:center; margin-bottom:22px;}
  .auth-card .logo img{height:56px;}
</style>
</head>
<body>

<nav></nav>

<div class="auth-wrap">
  <div class="book-form auth-card">
    <div class="logo"><img src="assets/Logo_NoBG.png" alt="GGS Studio"></div>
    <div class="copy-swap" id="authHead">
      <div class="section-tag" id="authTag">Welcome back</div>
      <h2 id="authTitle">Sign in</h2>
      <p class="section-note" id="authNote">Sign in to book a session and manage your bookings.</p>
    </div>

    <form id="authForm" novalidate>
      <div class="field collapse" id="nameField">
        <div class="collapse-inner">
          <label>Full name</label>
          <input type="text" id="aName" placeholder="Your name">
        </div>
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="aEmail" placeholder="you@email.com" required>
      </div>
      <div class="field">
        <label>Password</label>
        <div class="pw-wrap">
          <input type="password" id="aPassword" placeholder="••••••••" minlength="6" required>
          <button type="button" class="pw-toggle" data-pw-toggle="aPassword" aria-label="Show password">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <div class="submit-row">
        <button type="submit" id="authSubmit" class="book-submit">Sign in</button>
      </div>
      <div class="auth-toggle-row">
        <button type="button" id="authSwitch" class="btn-ghost">New here? Create an account</button>
      </div>
      <div class="confirm-msg" id="authMsg"></div>
    </form>
  </div>
</div>

<script type="module">
  import { getSupabase } from './js/supabase-client.js';
  import { initAuthNav, signUpChecked } from './js/auth.js';
  import { claimGuestBookings } from './js/device.js';
  import { initPasswordToggles } from './js/booking.js';
  import { clearFormErrors, showFieldErrors, setFieldError, isEmail } from './js/form-validate.js';

  initAuthNav();
  initPasswordToggles();

  const supabase = await getSupabase();
  const form = document.getElementById('authForm');
  const msg = document.getElementById('authMsg');
  const submit = document.getElementById('authSubmit');
  const switchBtn = document.getElementById('authSwitch');
  const nameField = document.getElementById('nameField');
  const authHead = document.getElementById('authHead');
  let mode = new URLSearchParams(location.search).get('mode') === 'signup' ? 'signup' : 'login';

  // Accepts old-style '?next=account.html' links too (bookmarks, anything
  // cached) — strip any .html suffix and land on the clean equivalent.
  // .has()/.get() distinguishes "?next=" (explicit: go home) from a bare
  // /login with no param at all (default: land on My Bookings).
  const nextParams = new URLSearchParams(location.search);
  const rawNext = nextParams.has('next') ? nextParams.get('next') : 'account';
  const nextPage = rawNext.replace(/\.html$/, '').replace(/^index$/, '');
  const next = nextPage === '' ? './' : nextPage;

  function render() {
    const signup = mode === 'signup';
    document.getElementById('authTag').textContent = signup ? 'Join the studio' : 'Welcome back';
    document.getElementById('authTitle').textContent = signup ? 'Create account' : 'Sign in';
    document.getElementById('authNote').textContent = signup
      ? "You don't need an account to book — this is for keeping your sessions in one place, on every device."
      : 'Sign in to pick up every session booked with this email, from any device.';
    nameField.classList.toggle('open', signup);
    // Re-trigger the crossfade: the class has to come off for a reflow first.
    authHead.classList.remove('swapping');
    void authHead.offsetWidth;
    authHead.classList.add('swapping');
    submit.textContent = signup ? 'Create account' : 'Sign in';
    switchBtn.textContent = signup ? 'Already have an account? Sign in' : 'New here? Create an account';
    msg.style.display = 'none';
  }

  function showMsg(text, isError) {
    msg.textContent = text;
    msg.classList.toggle('error', !!isError);
    msg.style.display = 'block';
  }

  switchBtn.addEventListener('click', () => {
    mode = mode === 'signup' ? 'login' : 'signup';
    clearFormErrors(form);
    render();
  });

  const nameEl = document.getElementById('aName');
  const emailEl = document.getElementById('aEmail');
  const passwordEl = document.getElementById('aPassword');

  // Every problem with the form as [control, reason] pairs, so all of them are
  // marked up in one pass rather than one per submit.
  function collectErrors() {
    const errors = [];
    if (mode === 'signup' && !nameEl.value.trim()) errors.push([nameEl, 'Please enter your full name.']);
    if (!emailEl.value.trim()) errors.push([emailEl, 'Please enter your email.']);
    else if (!isEmail(emailEl.value)) errors.push([emailEl, "That doesn't look like an email address — check for a typo."]);
    if (!passwordEl.value) errors.push([passwordEl, 'Please enter your password.']);
    else if (passwordEl.value.length < 6) errors.push([passwordEl, 'Password must be at least 6 characters.']);
    return errors;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.style.display = 'none';
    clearFormErrors(form);

    const errors = collectErrors();
    if (errors.length) {
      showFieldErrors(errors);
      return;
    }

    const email = emailEl.value.trim();
    const password = passwordEl.value;
    submit.disabled = true;
    try {
      if (mode === 'signup') {
        // signUpChecked signs the new account in as part of registering, so
        // there's nothing else to do but go where they were headed.
        const { session } = await signUpChecked(supabase, email, password, nameEl.value.trim());
        if (!session) {
          // Email confirmation is on — nothing to sign into yet.
          mode = 'login';
          render();
          showMsg('✓ Account created — check your email to confirm it, then sign in.', false);
          submit.disabled = false;
          return;
        }
      } else {
        const { error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) throw error;
      }
      // auth.js claims guest bookings on every sign-in, but this page navigates
      // away immediately and would cut that request off mid-flight. Do it here
      // and wait, so the bookings have moved across before My Bookings loads.
      const { data: signedIn } = await supabase.auth.getSession();
      if (signedIn.session) await claimGuestBookings(signedIn.session);
      location.href = next;
    } catch (err) {
      submit.disabled = false;
      // Point the blame at the field that owns it where we can tell.
      if (/already registered/i.test(err.message)) {
        setFieldError(emailEl, err.message);
        emailEl.focus();
        return;
      }
      if (/invalid login credentials/i.test(err.message)) {
        setFieldError(passwordEl, "That email and password don't match an account.");
        passwordEl.focus();
        return;
      }
      if (/email/i.test(err.message) && /invalid|valid/i.test(err.message)) {
        setFieldError(emailEl, err.message);
        emailEl.focus();
        return;
      }
      showMsg(`⚠ ${err.message}`, true);
    }
  });

  render();

  // Already signed in? Nothing to do here.
  const { data } = await supabase.auth.getSession();
  if (data.session) location.replace(next);
</script>

</body>
</html>
